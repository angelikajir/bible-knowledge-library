<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bible Knowledge Library</title><style>body{font-family:system-ui;margin:0;background:#f7f4ef;color:#2f2924}header{background:#5b4636;color:#fff;padding:18px}main{max-width:800px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{padding:15px;border:0;border-radius:12px;background:#fff;font-size:16px;box-shadow:0 1px 5px #0002}input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font:inherit}textarea{min-height:180px}.card{background:#fff;padding:16px;border-radius:14px;margin-top:16px}.hidden{display:none}.primary{background:#5b4636;color:#fff}</style></head><body><header><h1>Bible Knowledge Library</h1><small>Your personal Bible research library</small></header><main><section id="home"><div class="grid"><button class="primary" onclick="newNote()">＋ New Note</button><button onclick="newNote(true)">⚡ Quick Note</button><button onclick="notes()">▣ All Notes</button><button onclick="folders()">▣ Folders</button><button onclick="bible()">▤ Bible</button><button onclick="backup()">↕ Backup</button></div><div class="card"><b>Search everything</b><input placeholder="Search notes..." oninput="search(this.value)"><div id="results"></div></div></section><section id="editor" class="hidden"><button onclick="home()">← Home</button><h2>New Note</h2><input id="title" placeholder="Title"><textarea id="body" placeholder="Write your note..."></textarea><input id="refs" placeholder="Bible references, e.g. Genesis 15:6"><input id="foldersInput" placeholder="Folders, comma separated"><button class="primary" onclick="save()">Save note</button></section><section id="notes" class="hidden"><button onclick="home()">← Home</button><h2>Notes</h2><div id="noteList"></div></section><section id="folders" class="hidden"><button onclick="home()">← Home</button><h2>Folders</h2><button class="primary" onclick="addFolder()">＋ New folder</button><div id="folderList"></div></section><section id="bible" class="hidden"><button onclick="home()">← Home</button><h2>Bible</h2><p>66 Bible books are available as the foundation for later chapter/verse linking.</p><div id="books"></div></section><section id="backup" class="hidden"><button onclick="home()">← Home</button><h2>Backup</h2><button class="primary" onclick="exportData()">Export backup</button><div class="card"><input id="file" type="file" accept=".json"><button onclick="importData()">Restore backup</button></div></section></main><script>const K='bkl_v1';let d=JSON.parse(localStorage.getItem(K)||'{"notes":[],"folders":[]}');const books=['Genesis','Exodus','Leviticus','Numbers','Deuteronomy','Joshua','Judges','Ruth','1 Samuel','2 Samuel','1 Kings','2 Kings','1 Chronicles','2 Chronicles','Ezra','Nehemiah','Esther','Job','Psalms','Proverbs','Ecclesiastes','Song of Solomon','Isaiah','Jeremiah','Lamentations','Ezekiel','Daniel','Hosea','Joel','Amos','Obadiah','Jonah','Micah','Nahum','Habakkuk','Zephaniah','Haggai','Zechariah','Malachi','Matthew','Mark','Luke','John','Acts','Romans','1 Corinthians','2 Corinthians','Galatians','Ephesians','Philippians','Colossians','1 Thessalonians','2 Thessalonians','1 Timothy','2 Timothy','Titus','Philemon','Hebrews','James','1 Peter','2 Peter','1 John','2 John','3 John','Jude','Revelation'];function saveD(){localStorage.setItem(K,JSON.stringify(d))}function hide(){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'))}function home(){hide();document.getElementById('home').classList.remove('hidden')}function newNote(q){hide();document.getElementById('editor').classList.remove('hidden');document.getElementById('title').value=q?'Quick Note':'';document.getElementById('body').value='';document.getElementById('refs').value='';document.getElementById('foldersInput').value=''}function save(){d.notes.unshift({id:Date.now(),title:document.getElementById('title').value||'Untitled note',body:document.getElementById('body').value,refs:document.getElementById('refs').value,folders:document.getElementById('foldersInput').value.split(',').map(x=>x.trim()).filter(Boolean),date:new Date().toISOString()});saveD();notes()}function notes(){hide();document.getElementById('notes').classList.remove('hidden');renderNotes(d.notes)}function renderNotes(a){document.getElementById('noteList').innerHTML=a.length?a.map(n=>`<div class="card"><b>${esc(n.title)}</b><p>${esc(n.body)}</p><small>${esc(n.refs||'')} ${n.folders?.length?' · '+esc(n.folders.join(', ')):''}</small></div>`).join(''):'<p>No notes yet.</p>'}function folders(){hide();document.getElementById('folders').classList.remove('hidden');document.getElementById('folderList').innerHTML=d.folders.map(f=>`<div class="card">${esc(f)}</div>`).join('')||'<p>No folders yet.</p>'}function addFolder(){let x=prompt('Folder name:');if(x&&x.trim()){d.folders.push(x.trim());saveD();folders()}}function bible(){hide();document.getElementById('bible').classList.remove('hidden');document.getElementById('books').innerHTML=books.map((x,i)=>`<div class="card"><b>${i+1}. ${x}</b></div>`).join('')}function backup(){hide();document.getElementById('backup').classList.remove('hidden')}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='bible-knowledge-library-backup.json';a.click()}function importData(){let f=document.getElementById('file').files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{d=JSON.parse(r.result);saveD();alert('Backup restored');home()}catch(e){alert('Invalid backup')}};r.readAsText(f)}function search(q){q=q.toLowerCase();let r=d.notes.filter(n=>(n.title+' '+n.body+' '+n.refs+' '+(n.folders||[]).join(' ')).toLowerCase().includes(q));document.getElementById('results').innerHTML=q?r.map(n=>`<div class="card"><b>${esc(n.title)}</b><p>${esc(n.body).slice(0,160)}</p></div>`).join(''):'')}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
